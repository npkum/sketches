<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sketch Gallery</title>
<link rel="stylesheet" href="gallery.css">
<style>
header.slim{position:sticky;top:0;z-index:10;max-width:none;margin:0;height:52px;padding:0 16px;display:flex;align-items:center;justify-content:center;gap:12px;background:var(--card);border-bottom:1px solid var(--line)}
header.slim h1{font-size:1.25rem;line-height:1;margin:0;white-space:nowrap}
header.slim .sub{margin:0;font-size:.85rem;text-align:center;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
#grid{scroll-margin-top:64px}
@media(min-width:900px){#menu{top:68px;max-height:calc(100dvh - 84px)}}
</style>
</head>
<body>
<header class="slim">
  <h1>Sketch Gallery</h1>
  <span class="sub" id="count"></span>
</header>
<div class="layout">
  <nav aria-label="Categories"><div id="menu"></div></nav>
  <main><div id="grid"></div></main>
</div>
<footer>Sketches by <a href="https://www.linkedin.com/in/kumar-np" target="_blank" rel="noopener">Kumar N.P</a></footer>

<div id="lb" role="dialog" aria-modal="true" aria-label="Image viewer">
  <span class="n" id="lbc"></span>
  <button class="lbb" id="lbx" aria-label="Close">&#10005;</button>
  <button class="lbb" id="lbp" aria-label="Previous">&#10094;</button>
  <img id="lbi" alt="">
  <p id="lbt"></p>
  <button class="lbb" id="lbn" aria-label="Next">&#10095;</button>
</div>

<script src="gallery-data.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const D = window.GALLERY_DATA || {categories: [], images: []};
const cats = (D.categories || []).map(c => ({...c, subs: c.subs || []}));
const catIdx = id => { const x = cats.findIndex(c => c.id === id); return x < 0 ? 1e9 : x; };
const subIdx = i => { const c = cats.find(c => c.id === i.cat); return c && i.sub ? c.subs.findIndex(s => s.id === i.sub) : -1; };
// order: category, then sub-menu, then the order number (lower first)
const imgs = (D.images || []).map((i, x) => ({...i, _x: x})).filter(i => i.on !== false)
  .sort((a, b) => catIdx(a.cat) - catIdx(b.cat) || subIdx(a) - subIdx(b) || (a.order ?? 1e9) - (b.order ?? 1e9) || a._x - b._x);
const catName = id => (cats.find(c => c.id === id) || {name: 'Uncategorized'}).name;
const subName = (cid, sid) => { const c = cats.find(c => c.id === cid), s = c && c.subs.find(s => s.id === sid); return s ? s.name : ''; };
let view = [], cur = 0, sub = '';

// Start: #category or #category/submenu from a link, else the default set in Manage (Miscellaneous), else All
let cat = (() => {
  const [h, s] = decodeURIComponent(location.hash.slice(1)).split('/');
  if (h === 'all' || cats.some(c => c.id === h)){ if (cats.some(c => c.id === h && c.subs.some(x => x.id === s))) sub = s; return h; }
  if (cats.some(c => c.id === D.defaultCat)) return D.defaultCat;
  const m = cats.find(c => /^miscellaneous$/i.test(c.name));
  return m ? m.id : 'all';
})();

function render(){
  // a category counts / shows only its own images; a sub-menu only its own
  const cnt = (c, s) => c === 'all' ? imgs.length : imgs.filter(i => i.cat === c && (i.sub || '') === (s || '')).length;
  // a category that has no images of its own opens its first sub-menu that has some
  if (cat !== 'all' && !sub && !cnt(cat, '')){ const c = cats.find(c => c.id === cat), f = c && c.subs.find(s => cnt(cat, s.id)); if (f) sub = f.id; }
  const chip = (c, s, name, n, on, cur) => `<button class="chip${s ? ' sub' : ''}" data-c="${esc(c)}" data-s="${esc(s)}" aria-pressed="${on}"${cur ? ' aria-current="true"' : ''}>${esc(name)}<b>${n}</b></button>`;
  let h = chip('all', '', 'All', cnt('all', ''), cat === 'all');
  cats.forEach(c => {
    const n = cnt(c.id, ''); if (c.id !== cat && !imgs.some(i => i.cat === c.id)) return;
    h += chip(c.id, '', c.name, n, cat === c.id && !sub, cat === c.id && !!sub);
    if (c.id === cat) {
      const ss = c.subs.filter(s => s.id === sub || cnt(c.id, s.id));
      if (ss.length) h += '<div class="subs">' + ss.map(s => chip(c.id, s.id, s.name, cnt(c.id, s.id), sub === s.id)).join('') + '</div>';
    }
  });
  $('menu').innerHTML = h;
  view = cat === 'all' ? imgs : imgs.filter(i => i.cat === cat && (i.sub || '') === sub);
  $('count').textContent = `${view.length} sketch${view.length === 1 ? '' : 'es'}` + (cat === 'all' ? '' : ' in ' + catName(cat) + (sub ? ' › ' + subName(cat, sub) : ''));
  const tag = i => cat === 'all' ? catName(i.cat) + (i.sub ? ' › ' + subName(i.cat, i.sub) : '') : '';
  $('grid').innerHTML = view.length ? view.map(i => `
    <figure class="card">
      <img src="${esc(i.src)}" alt="${esc(i.caption || 'Sketch')}" loading="lazy" tabindex="0" data-id="${esc(i.id)}">
      ${i.caption || tag(i) ? `<figcaption>${tag(i) ? `<span class="tag">${esc(tag(i))}</span>` : ''}${esc(i.caption)}</figcaption>` : ''}
    </figure>`).join('') : '<div class="empty">No sketches here yet.</div>';
}
$('menu').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  cat = b.dataset.c; sub = b.dataset.s || '';
  history.replaceState(null, '', '#' + encodeURIComponent(cat) + (sub ? '/' + encodeURIComponent(sub) : '')); render();
  if (innerWidth < 900) $('grid').scrollIntoView({behavior: 'smooth', block: 'start'});
});
$('grid').addEventListener('click', e => { if (e.target.tagName === 'IMG' && !e.target.classList.contains('broken')) openLb(e.target.dataset.id); });
$('grid').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName === 'IMG') e.target.click(); });
$('grid').addEventListener('error', e => { if (e.target.tagName === 'IMG'){ e.target.classList.add('broken'); e.target.alt = 'Image not found'; } }, true);

function openLb(id){ cur = Math.max(0, view.findIndex(i => i.id === id)); showLb(); $('lb').classList.add('open'); document.body.style.overflow = 'hidden'; $('lbx').focus(); }
function closeLb(){ $('lb').classList.remove('open'); document.body.style.overflow = ''; }
function showLb(){
  const i = view[cur]; if (!i) return closeLb();
  $('lbi').src = i.src; $('lbi').alt = i.caption || 'Sketch'; $('lbt').textContent = i.caption || '';
  $('lbc').textContent = `${cur + 1} / ${view.length}  ·  ${catName(i.cat)}${i.sub ? ' › ' + subName(i.cat, i.sub) : ''}`;
}
const step = d => { cur = (cur + d + view.length) % view.length; showLb(); };
$('lbp').onclick = () => step(-1); $('lbn').onclick = () => step(1); $('lbx').onclick = closeLb;
$('lb').addEventListener('click', e => { if (e.target === $('lb')) closeLb(); });
document.addEventListener('keydown', e => {
  if (!$('lb').classList.contains('open')) return;
  if (e.key === 'Escape') closeLb(); else if (e.key === 'ArrowLeft') step(-1); else if (e.key === 'ArrowRight') step(1);
});
let tx = null;
$('lb').addEventListener('touchstart', e => tx = e.touches[0].clientX, {passive: true});
$('lb').addEventListener('touchend', e => { if (tx === null) return; const d = e.changedTouches[0].clientX - tx; if (Math.abs(d) > 50) step(d < 0 ? 1 : -1); tx = null; });
render();
</script>
</body>
</html>
